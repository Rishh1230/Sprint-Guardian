# Copy this file to references/team-map.local.yaml and replace placeholders.

board:
  id: "1234"
  project_keys:
    - "PROJ"

defaults:
  dry_run: true
  backlog_jql: "project in (PROJ) AND statusCategory != Done AND sprint is EMPTY ORDER BY priority DESC, created ASC"
  active_sprint_jql: "project in (PROJ) AND sprint in openSprints() ORDER BY Rank ASC"
  fields: "summary,status,assignee,priority,components,labels,updated,created,duedate"
  stale_after_days: 3
  standup_lookback_days: 1
  blocked_statuses:
    - "Blocked"
    - "On Hold"
  active_statuses:
    - "In Progress"
    - "In Review"
    - "Testing"
  done_statuses:
    - "Done"
    - "Closed"
    - "Resolved"

approval:
  assignee_change_requires_approval: true
  allow_apply_without_approval: false
  assigning_authorities:
    - name: "Team Lead"
      jira_assignee: "lead@example.com"
      scope:
        - "PROJ"
  # Note: audit_log below is for documentation reference only. The actual log path is
  # always set by the orchestrator script to automation/output/approvals.log.
  audit_log: "automation/output/approvals.log"

team:
  - name: "Team Lead"
    jira_assignee: "lead@example.com"
    team: "PROJ"
    skills:
      - "backend"
      - "lead"
      - "automation"
    components:
      - "PROJ"
    labels:
      - "backend"
    max_in_progress: 3
    sprint_capacity_points: 15
    backup_assignee: "engineer.one@example.com"
    unavailable_dates: []
    assignment_allowlist: true

  - name: "Engineer One"
    jira_assignee: "engineer.one@example.com"
    team: "PROJ"
    skills:
      - "frontend"
      - "automation"
    components:
      - "PROJ"
    labels:
      - "frontend"
    max_in_progress: 2
    sprint_capacity_points: 8
    backup_assignee: "engineer.two@example.com"
    unavailable_dates: []
    assignment_allowlist: true

  - name: "Engineer Two"
    jira_assignee: "engineer.two@example.com"
    team: "PROJ"
    skills:
      - "testing"
      - "qa"
    components:
      - "PROJ"
      - "PROJ-Test"
    labels:
      - "testing"
    max_in_progress: 2
    sprint_capacity_points: 8
    backup_assignee: "engineer.one@example.com"
    unavailable_dates: []
    assignment_allowlist: true

rules:
  ownership_order:
    - "component"
    - "label"
    - "skill"
    - "history"
  never_auto_assign_labels:
    - "security"
    - "architecture"
    - "needs-manager-review"
  cross_team_assignment_requires_approval: true
